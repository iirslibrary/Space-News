name: 🚀 Space News + Pages Link

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Workflow mode'
        required: true
        default: 'publish'
        type: choice
        options:
          - flag_review
          - publish
      snapshot_date:
        description: 'Optional snapshot date in YYYY-MM-DD format'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: openrouter/free
      SNAPSHOT_DATE: ${{ github.event.inputs.snapshot_date }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-docx googlenewsdecoder newspaper3k lxml_html_clean beautifulsoup4 requests

      - name: 📰 Generate HTML + DOCX newsletter
        env:
          WORKFLOW_RUN_MODE: ${{ github.event_name == 'schedule' && 'draft' || inputs.run_mode }}
        run: python iirs_space_digest_git.py

      - name: 📂 Show generated files
        run: |
          ls -lah
          echo "---- Matching HTML files ----"
          ls -lah Space_News_*.html || true
          echo "---- Admin Review File ----"
          ls -lah admin-review.html || true
          echo "---- Matching DOCX files ----"
          ls -lah Space_News_*.docx || true

      - name: 📋 Copy latest HTML to index.html for hosting
        shell: bash
        run: |
          shopt -s nullglob
          html_files=(Space_News_*.html)

          if [ ${#html_files[@]} -eq 0 ]; then
            echo "❌ No Space_News_*.html file found"
            exit 1
          fi

          latest_html=$(ls -t "${html_files[@]}" | head -n 1)
          cp "$latest_html" index.html

          echo "✅ Copied $latest_html to index.html"
          ls -lah index.html

      - name: 💾 Commit snapshot, flagged URLs, and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update daily snapshot and digest outputs"
          git pull --rebase origin main
          git push

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 📝 Prepare email content
        id: email_content
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "publish" ]; then
            # 🌟 SCENARIO 1: The team hit publish! Send the public link.
            echo "subject=Today's Space News compiled and published by LIRD" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "✅ Today's Space News is LIVE and APPROVED!"
              echo
              echo "READ & SHARE:"
              echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
              echo
              echo "Copy this link and forward to IIRS team via office email."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "flag_review" ]; then
            # 🌟 SCENARIO 2: Intermediate Flag Update. Let the team know the list was updated.
            echo "subject=🔄 UPDATE: Bad articles removed (Still pending publish)" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "✅ The flagged articles have been successfully removed from the draft."
              echo
              echo "You can review the updated list and hit Publish here:"
              echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/admin-review.html"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            
          else
            # 🌟 SCENARIO 3: Morning automated run. Send the secret admin link for initial review.
            echo "subject=🚧 ACTION REQUIRED: Review Today's Space News Draft" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "📡 Today's Space News has been fetched and is awaiting review."
              echo
              echo "🔐 ADMIN REVIEW LINK:"
              echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/admin-review.html"
              echo
              echo "(The public link currently shows a 'Please Wait' screen until you hit Publish)"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Send link to Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: ${{ steps.email_content.outputs.subject }}
          body: ${{ steps.email_content.outputs.body }}
          to: <${{ secrets.GMAIL_USER2 }}>,<${{ secrets.GMAIL_USER3 }}>,<${{ secrets.GMAIL_USER4 }}>
          from: 'IIRS Library <${{ secrets.GMAIL_USER }}>'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
