name: 🚀 Space News + Pages Link

on:
  schedule:
    - cron: '30 4 * * *'  # 8:00 AM IST daily
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Type of workflow run'
        required: true
        default: 'publish'
        type: choice
        options:
          - flag_review
          - publish

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-docx googlenewsdecoder newspaper3k lxml_html_clean beautifulsoup4 requests

      - name: 📰 Generate HTML + DOCX newsletter
        run: python iirs_space_digest_git.py

      - name: 📂 Show generated files
        run: |
          ls -lah
          echo "---- Matching HTML files ----"
          ls -lah Space_News_*.html || true
          echo "---- Matching DOCX files ----"
          ls -lah Space_News_*.docx || true

      - name: 📋 Copy latest HTML to index.html for hosting
        shell: bash
        run: |
          shopt -s nullglob
          html_files=(Space_News_*.html)

          if [ ${#html_files[@]} -eq 0 ]; then
            echo "❌ No Space_News_*.html file found"
            exit 1
          fi

          latest_html=$(ls -t "${html_files[@]}" | head -n 1)
          cp "$latest_html" index.html

          echo "✅ Copied $latest_html to index.html"
          echo "---- index.html details ----"
          ls -lah index.html

      - name: 💾 Commit snapshot, flagged URLs, and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update daily snapshot and digest outputs"
          git push

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          keep_files: false

      - name: 📎 Find latest DOCX file
        id: latest_docx
        shell: bash
        run: |
          shopt -s nullglob
          docx_files=(Space_News_*.docx)

          if [ ${#docx_files[@]} -eq 0 ]; then
            echo "❌ No Space_News_*.docx file found"
            exit 1
          fi

          latest_docx=$(ls -t "${docx_files[@]}" | head -n 1)
          echo "latest_docx=$latest_docx" >> "$GITHUB_OUTPUT"
          echo "✅ Latest DOCX: $latest_docx"

      - name: ✅ Send link + latest DOCX to Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: >-
            ${{ github.event_name == 'workflow_dispatch' &&
                inputs.run_mode == 'flag_review' &&
                format('🚀 Space News | {0} | For Flag | Run #{1}', github.event_name, github.run_number) ||
                github.event_name == 'workflow_dispatch' &&
                inputs.run_mode == 'publish' &&
                format('🚀 Space News | {0} | Published | Run #{1}', github.event_name, github.run_number) ||
                format('🚀 Space News | {0} | Scheduled | Run #{1}', github.event_name, github.run_number) }}
          body: |
            ${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'flag_review' && '📡 Today'\''s Space News is LIVE for review!

            Run type: workflow_dispatch
            Run number: ' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'flag_review' && github.run_number || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'flag_review' && '

            🔗 READ & SHARE:
            https://' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'flag_review' && github.repository_owner || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'flag_review' && '.github.io/' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'flag_review' && github.event.repository.name || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'flag_review' && '/

            Attached: DOCX digest for flagging, submitting and publishing.' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'publish' && '📡 Today'\''s Space News is LIVE!

            Run type: workflow_dispatch
            Run number: ' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'publish' && github.run_number || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'publish' && '

            🔗 READ & SHARE:
            https://' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'publish' && github.repository_owner || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'publish' && '.github.io/' || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'publish' && github.event.repository.name || '' }}${{ github.event_name == 'workflow_dispatch' && inputs.run_mode == 'publish' && '/

            Attached: Today'\''s DOCX digest for office circulation.' || '' }}${{ github.event_name == 'schedule' && '📡 Today'\''s Space News is LIVE!

            Run type: schedule
            Run number: ' || '' }}${{ github.event_name == 'schedule' && github.run_number || '' }}${{ github.event_name == 'schedule' && '

            🔗 READ & SHARE:
            https://' || '' }}${{ github.event_name == 'schedule' && github.repository_owner || '' }}${{ github.event_name == 'schedule' && '.github.io/' || '' }}${{ github.event_name == 'schedule' && github.event.repository.name || '' }}${{ github.event_name == 'schedule' && '/

            Attached: Today'\''s DOCX digest for office circulation.

            ────────────────────────────
            Copy this link and forward to IIRS team via office email.' || '' }}
          to: <${{ secrets.GMAIL_USER2 }}>,<${{ secrets.GMAIL_USER3 }}>,<${{ secrets.GMAIL_USER4 }}>
          from: 'IIRS Library <${{ secrets.GMAIL_USER }}>'
          attachments: ${{ steps.latest_docx.outputs.latest_docx }}
