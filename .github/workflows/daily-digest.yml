name: 🚀 Space News + Pages Link

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Workflow mode'
        required: true
        default: 'publish'
        type: choice
        options:
          - flag_review
          - publish

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser python-docx googlenewsdecoder newspaper3k lxml_html_clean beautifulsoup4 requests

      - name: 📰 Generate HTML + DOCX newsletter
        run: python iirs_space_digest_git.py

      - name: 📂 Show generated files
        run: |
          ls -lah
          echo "---- Matching HTML files ----"
          ls -lah Space_News_*.html || true
          echo "---- Matching DOCX files ----"
          ls -lah Space_News_*.docx || true

      - name: 📋 Copy latest HTML to index.html for hosting
        shell: bash
        run: |
          shopt -s nullglob
          html_files=(Space_News_*.html)

          if [ ${#html_files[@]} -eq 0 ]; then
            echo "❌ No Space_News_*.html file found"
            exit 1
          fi

          latest_html=$(ls -t "${html_files[@]}" | head -n 1)
          cp "$latest_html" index.html

          echo "✅ Copied $latest_html to index.html"
          ls -lah index.html

      - name: 💾 Commit snapshot, flagged URLs, and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Update daily snapshot and digest outputs"
          git pull --rebase origin main
          git push

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📤 Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: 📎 Find latest DOCX file
        id: latest_docx
        shell: bash
        run: |
          shopt -s nullglob
          docx_files=(Space_News_*.docx)

          if [ ${#docx_files[@]} -eq 0 ]; then
            echo "❌ No Space_News_*.docx file found"
            exit 1
          fi

          latest_docx=$(ls -t "${docx_files[@]}" | head -n 1)
          echo "latest_docx=$latest_docx" >> "$GITHUB_OUTPUT"
          echo "✅ Latest DOCX: $latest_docx"

      - name: 📝 Prepare email content
        id: email_content
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "flag_review" ]; then
            echo "subject=🚀 Space News | workflow_dispatch | For Flag | Run #${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "📡 Today's Space News is LIVE!"
              echo
              echo "Run type: workflow_dispatch"
              echo "Run number: ${{ github.run_number }}"
              echo
              echo "🔗 READ & SHARE:"
              echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
              echo
              echo "Attached: DOCX digest for flagging, submitting and publishing."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_mode }}" = "publish" ]; then
            echo "subject=Today's Space News compiled and published by LIRD" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "Today's Space News is LIVE!"
              echo
              echo "READ & SHARE:"
              echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
              echo
              echo "Attached: DOCX digest for circulation"
              echo
              echo "Copy this link and forward to IIRS team via office email."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "subject=🚀 Space News | ${{ github.event_name }} | Run #${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            {
              echo "body<<EOF"
              echo "📡 Today's Space News is LIVE!"
              echo
              echo "Run type: ${{ github.event_name }}"
              echo "Run number: ${{ github.run_number }}"
              echo
              echo "🔗 READ & SHARE:"
              echo "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
              echo
              echo "Attached: Today's DOCX digest for office circulation."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: ✅ Send link + latest DOCX to Gmail
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_PASS }}
          subject: ${{ steps.email_content.outputs.subject }}
          body: ${{ steps.email_content.outputs.body }}
          to: <${{ secrets.GMAIL_USER2 }}>,<${{ secrets.GMAIL_USER3 }}>,<${{ secrets.GMAIL_USER4 }}>
          from: 'IIRS Library <${{ secrets.GMAIL_USER }}>'
          attachments: ${{ steps.latest_docx.outputs.latest_docx }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write

    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
