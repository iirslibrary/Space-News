<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Sankalan Generator - LIRD IIRS</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; color: #333; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { width: 100%; max-width: 520px; background: #ffffff; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
        .date-group { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .date-field { text-align: left; }
        .date-field label { font-weight: bold; font-size: 0.85em; display: block; margin-bottom: 5px; color: #555; }
        .date-field input { padding: 8px; border-radius: 6px; border: 1px solid #ccc; font-family: inherit; }
        .action-btn { background-color: #4CAF50; color: white; padding: 12px 25px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 1em; width: 100%; }
        .action-btn:hover { background-color: #45a049; }
        .download-box { margin-top: 25px; padding: 15px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 6px; display: none; }
        .download-btn { display: inline-block; background-color: #2e7d32; color: white; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .nav-link { margin-top: 25px; display: block; color: #666; text-decoration: none; font-size: 0.9em; }
        #authSection { margin: 20px 0; display: flex; flex-direction: column; align-items: center; }
        #generatorSection { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="margin-bottom: 8px; color: #1F4E78;">📚 Generate Weekly Sankalan</h2>
        
        <!-- Google Sign-In Section (Shown if not logged in) -->
        <div id="authSection">
            <p style="font-size: 0.9em; color: #666; margin-bottom: 15px;">Please sign in with your authorized Google account to continue.</p>
            <div id="g_id_onload"
                 data-client_id="585110924508-lfjo1ma5u0cpqe0qihpj0d3mlb7344sp.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with" data-shape="rectangular" data-logo_alignment="left"></div>
        </div>

        <!-- Generator Section (Shown after logging in) -->
        <div id="generatorSection">
            <p style="font-size: 0.85em; color: #666; margin-bottom: 20px;">Select a date range (Max 7 days range, up to 1 month old).</p>
            
            <div class="date-group">
                <div class="date-field">
                    <label for="sankalanFrom">From:</label>
                    <input type="date" id="sankalanFrom">
                </div>
                <div class="date-field">
                    <label for="sankalanTo">To:</label>
                    <input type="date" id="sankalanTo">
                </div>
            </div>
            
            <button type="button" class="action-btn" onclick="triggerSankalanBuild()">Start Compilation Pipeline</button>

            <div id="downloadBox" class="download-box">
                <p id="statusMessage" style="margin: 0; font-size: 0.9em; color: #2e7d32; font-weight: bold;"></p>
                <a id="downloadLink" href="#" class="download-btn" target="_blank" style="display:none;">⬇️ Download Compiled .docx</a>
            </div>
        </div>

        <a href="admin-review.html" class="nav-link">← Back to Daily Admin Review</a>
    </div>

    <script>
        const API_BASE = "https://space-news-sage.vercel.app";

        // Check login state on page load
        window.addEventListener("DOMContentLoaded", () => {
            const token = localStorage.getItem("google_token") || localStorage.getItem("id_token") || sessionStorage.getItem("google_token");
            if (token) {
                document.getElementById("generatorSection").style.display = "block";
                document.getElementById("authSection").style.display = "none";
            } else {
                document.getElementById("authSection").style.display = "flex";
                document.getElementById("generatorSection").style.display = "none";
            }
        });

        // Handle Google Sign-In response
        function handleCredentialResponse(response) {
            const token = response.credential;
            localStorage.setItem("google_token", token);
            document.getElementById("authSection").style.display = "none";
            document.getElementById("generatorSection").style.display = "block";
        }

        async function triggerSankalanBuild() {
            const fromDateStr = document.getElementById("sankalanFrom").value;
            const toDateStr = document.getElementById("sankalanTo").value;
            const statusMsg = document.getElementById("statusMessage");
            const downloadBox = document.getElementById("downloadBox");
            const downloadLink = document.getElementById("downloadLink");

            if (!fromDateStr || !toDateStr) { 
                alert("Please select both dates."); 
                return; 
            }

            const fromDate = new Date(fromDateStr);
            const toDate = new Date(toDateStr);
            const today = new Date();
            
            // Calculate date one month older than today
            const oneMonthAgo = new Date();
            oneMonthAgo.setMonth(today.getMonth() - 1);

            // Validation 1: Check if dates are older than one month
            if (fromDate < oneMonthAgo || toDate < oneMonthAgo) {
                alert("Validation Error: Dates cannot be older than one month.");
                return;
            }

            // Validation 2: Check date order and maximum 7-day span
            const diffTime = toDate - fromDate;
            const diffDays = diffTime / (1000 * 60 * 60 * 24);

            if (diffDays < 0) {
                alert("Validation Error: 'From' date cannot be after 'To' date.");
                return;
            }

            if (diffDays > 7) {
                alert("Validation Error: The date difference cannot be more than 7 days.");
                return;
            }

            // Retrieve authentication token
            const token = localStorage.getItem("google_token") || localStorage.getItem("id_token") || sessionStorage.getItem("google_token");
            
            if (!token) {
                alert("Authentication token missing. Please sign in.");
                location.reload();
                return;
            }

            downloadBox.style.display = "block";
            downloadLink.style.display = "none";
            
            // Start 60-second countdown timer
            let timeLeft = 180;
            statusMsg.style.color = "#2e7d32";
            
            const countdownInterval = setInterval(() => {
                if (timeLeft > 0) {
                    statusMsg.textContent = `🚀 Build triggered! Compiling on GitHub... Please wait (${timeLeft}s remaining)`;
                    timeLeft--;
                } else {
                    clearInterval(countdownInterval);
                    statusMsg.textContent = "✅ Compilation finished! You can now download your file:";
                    
                    const filename = `SANKALAN_${fromDateStr}_to_${toDateStr}.docx`;
                    downloadLink.href = filename;
                    downloadLink.style.display = "inline-block";
                }
            }, 1000);

            try {
                const response = await fetch(`${API_BASE}/api/generate-sankalan`, {
                    method: "POST",
                    headers: { 
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify({ fromDate: fromDateStr, toDate: toDateStr })
                });
                
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Failed to trigger build.");

            } catch (err) {
                clearInterval(countdownInterval);
                statusMsg.textContent = "❌ Error: " + err.message;
                statusMsg.style.color = "red";
                downloadBox.style.display = "block";
            }
        }
    </script>
</body>
</html>
